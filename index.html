<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <h1>Meme Generator</h1>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>1 · Texto</h2>
        <div class="field">
          <label for="text">
            Rótulo
            <span class="muted small">· lo que envuelvas en *asteriscos* sale resaltado</span>
          </label>
          <textarea id="text" rows="4" placeholder="Escribe aquí el texto del meme"></textarea>
        </div>

        <div class="field">
          <label for="align">Alineación</label>
          <select id="align">
            <option value="center" selected>Centrado</option>
            <option value="left">A la izquierda</option>
          </select>
        </div>

        <div class="field">
          <label for="size">
            Tamaño de letra
            <span class="muted small">· <span id="size-value">52</span> px · la banda se adapta</span>
          </label>
          <input type="range" id="size" min="26" max="84" step="1" value="52" />
        </div>

        <h2>2 · Imagen</h2>
        <div id="drop" class="drop">
          <input type="file" id="file" accept="image/*" hidden />
          <p><strong>Arrastra una foto aquí</strong></p>
          <p class="muted">o</p>
          <button type="button" id="pick" class="btn-secondary">Elegir archivo…</button>
          <p class="muted small" id="file-name">Ningún archivo seleccionado</p>
        </div>

        <h2>3 · Encuadre</h2>
        <div class="field">
          <label for="zoom">
            Zoom <span class="muted small">· arrastra la vista previa para mover la foto</span>
          </label>
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" />
        </div>

        <h2>4 · Colores</h2>
        <div class="field">
          <label for="color-band">Banda</label>
          <select id="color-band"></select>
        </div>
        <div class="field">
          <label for="color-text">Texto</label>
          <select id="color-text"></select>
        </div>
        <div class="field">
          <label for="color-highlight">Resaltado</label>
          <select id="color-highlight"></select>
        </div>

        <button type="button" id="generate" class="btn">GENERA</button>
        <p class="status" id="status"></p>
      </section>

      <section class="panel" id="preview-panel">
        <h2>Vista previa</h2>
        <div class="stage">
          <canvas id="preview"></canvas>
        </div>
        <p class="muted small" id="preview-info"></p>
      </section>
    </main>

    <section class="output" id="output" hidden>
      <h2>Resultado</h2>
      <canvas id="result"></canvas>
      <p class="muted small" id="result-info"></p>
      <button type="button" id="download" class="btn">Descargar PNG</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
